name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deployment under way finishes: the next one waits for it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The largest region file is stored with Git LFS: cached, keyed by the ids of the LFS files, so that it is only
      # downloaded again when it changes (LFS downloads count against a monthly quota)
      - run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-ids
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
      - run: git lfs pull
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The runner has Rust: the engine is rebuilt from crates/engine
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: bun run build
        env:
          BASE_PATH: /geo-reach/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
