[package]
name = "prep"
version = "0.1.0"
edition = "2024"
description = "Prepares the data of geo-reach: the road network and the public transport of each region"

[[bin]]
name = "prep"
path = "src/main.rs"

[dependencies]
csv = "1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
