[workspace]
members = ["crates/engine", "crates/prep"]
resolver = "2"

[workspace.lints.clippy]
# Strict: numeric casts, digit grouping… (intentional exceptions carry an `allow` and their reason)
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
